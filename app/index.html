<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>任務排程助手</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="toolbar">
  <h1>任務排程助手</h1>
  <div class="storage-status">
    <span id="storageStatusText">尚未匯入檔案（新任務清單） · 0 筆任務</span>
    <div class="storage-actions">
      <button id="exportBtn" type="button">匯出 tasks.json</button>
      <button id="importBtn" type="button">匯入 tasks.json</button>
      <input id="importFileInput" type="file" accept="application/json,.json" class="hidden">
    </div>
    <span class="storage-hint">任務只存在記憶體中，不會自動儲存。開啟頁面後請先「匯入」既有的 tasks.json；新增/編輯/刪除後要按「匯出」下載存檔，否則重新整理頁面會遺失變更。</span>
  </div>
  <button id="addTaskBtn" type="button">+ 新增任務</button>
</header>

<nav class="tabs">
  <button id="tabTasksBtn" type="button" class="tab-btn selected">任務清單</button>
  <button id="tabOverviewBtn" type="button" class="tab-btn">每日總覽</button>
</nav>

<main>
  <section id="pageTasks" class="page">
    <p id="emptyState" class="notice">目前沒有任務。點右上角「新增任務」開始。</p>
    <table id="taskTable" class="hidden">
      <thead>
        <tr>
          <th>任務名稱</th>
          <th>標籤</th>
          <th>緊急層級</th>
          <th>投入型態 / 建議策略</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="taskTableBody"></tbody>
    </table>
  </section>

  <section id="pageOverview" class="page hidden">
    <p id="overviewEmptyState" class="notice">目前沒有任務，總覽會在你新增任務後自動整理。</p>
    <div id="overviewContent" class="hidden">
      <div id="overviewPriority" class="overview-priority hidden"></div>
      <div id="overviewGroups" class="overview-groups"></div>
    </div>
  </section>
</main>

<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="modalTitle">新增任務</h2>

    <label class="field">
      任務名稱
      <input id="taskName" type="text" placeholder="例如：寫季度報告">
    </label>

    <div id="axisGroups"></div>

    <div id="downstreamField" class="field downstream-field hidden">
      下游實際需要的日期（選填 — INV-1：連鎖依賴不可能真的無期限）
      <input id="downstreamDeadlineInput" type="date">
      <span class="field-hint">留空的話，系統會自動降級視為軟期限（A2）；填了日期則視為硬期限（A1）。</span>
    </div>

    <div id="suggestionPanel" class="suggestion-panel">
      <p class="suggestion-hint">選擇 A / B / C / D 四個標籤後，這裡會顯示建議策略。</p>
    </div>

    <div class="modal-actions">
      <button id="cancelBtn" type="button">取消</button>
      <button id="saveBtn" type="button">儲存</button>
    </div>
  </div>
</div>

<script src="rules.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
